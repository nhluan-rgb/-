name: Update SCV.csv from latest CSV

on:
  push:
    paths:
      - "*.csv"
      - "**/*.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scv-csv
  cancel-in-progress: true

jobs:
  update-scv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest CSV and update SCV.csv
        id: update
        shell: python
        run: |
          from pathlib import Path
          import os
          import shutil
          import subprocess

          root = Path.cwd()
          target = root / "SCV.csv"

          candidates = [
              path for path in root.rglob("*.csv")
              if path.is_file()
              and path.resolve() != target.resolve()
              and ".git" not in path.parts
          ]

          if not candidates:
              raise SystemExit(
                  "Không tìm thấy file CSV nguồn mới."
              )

          def last_commit_time(path):
              relative = path.relative_to(root).as_posix()

              result = subprocess.run(
                  [
                      "git",
                      "log",
                      "-1",
                      "--format=%ct",
                      "--",
                      relative
                  ],
                  capture_output=True,
                  text=True
              )

              value = result.stdout.strip()
              return int(value) if value.isdigit() else 0

          source = max(
              candidates,
              key=lambda path: (
                  last_commit_time(path),
                  path.stat().st_mtime_ns
              )
          )

          source_name = source.relative_to(root).as_posix()

          # Cập nhật file cố định mà trang web đang đọc
          shutil.copyfile(source, target)

          # Xóa toàn bộ CSV nguồn, chỉ giữ lại SCV.csv
          for csv_file in candidates:
              csv_name = csv_file.relative_to(root).as_posix()
              csv_file.unlink()
              print(f"Deleted source CSV: {csv_name}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(f"source={source_name}\n")

          print(f"Updated SCV.csv from: {source_name}")

      - name: Commit SCV.csv and remove source CSV files
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Không có thay đổi cần commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m \
            "Auto-update SCV.csv from ${{ steps.update.outputs.source }}"
          git push
