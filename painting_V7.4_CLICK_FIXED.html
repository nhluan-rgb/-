<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>塗装工程ダッシュボード</title>
<style>
:root{--cyan:#5cecff;--navy:#061b30;--panel:#0c3550e8;--rust:#df4a2f;--bake:#8b5cf6;--other:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic","Meiryo",sans-serif;color:#fff;background:#041524 url("assets/bg_40.png") center/cover fixed no-repeat}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(#02111dcc,#03283ca8);z-index:-1}
button,input{font:inherit}.app{min-height:100vh;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 24px;border:2px solid #75e8ff;border-radius:18px;background:#092b42e8;box-shadow:0 6px 0 #021421,0 0 24px #00c8ff42}
.title{display:flex;align-items:center;gap:16px}.logo{width:68px;height:68px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#27d5ff,#0867bc);font-size:36px;box-shadow:0 0 18px #3ce4ff}.title h1{margin:0;font-size:35px}.title p{margin:4px 0 0;color:#bdefff;font-size:17px;font-weight:800}.actions{display:flex;gap:10px}.btn{padding:13px 20px;border:2px solid #8defff;border-radius:12px;background:#0d5480;color:#fff;text-decoration:none;font-weight:1000;cursor:pointer}.btn:hover{filter:brightness(1.2)}
.mission{margin-top:14px;padding:20px 24px;border:2px solid #ffda62;border-radius:18px;background:linear-gradient(100deg,#4b1306e8,#8f260ce0);box-shadow:0 6px 0 #2b0a03,0 0 22px #ff541f55}.mission b{font-size:31px;color:#fff3a0;text-shadow:0 0 12px #ff4b22}.mission span{display:block;margin-top:7px;font-size:19px;font-weight:900}
.deadline-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin-top:14px;padding:11px;border:2px solid #6de5ff;border-radius:18px;background:#06283ee8;box-shadow:0 6px 0 #021724,0 0 20px #00c7ff38}.deadline-tab{min-height:145px;padding:14px;border:2px solid #9fdff0;border-radius:14px;background:linear-gradient(180deg,#eefaff,#cfe7f2);color:#123047;text-align:left;cursor:pointer;box-shadow:0 4px 0 #174b64;transition:.16s}.deadline-tab:hover,.deadline-tab.active{transform:translateY(-3px);border-color:#53ecff;box-shadow:0 6px 0 #087da0,0 0 18px #4de8ff}.deadline-tab.critical{background:linear-gradient(180deg,#ff7b31,#c52d13);border-color:#ffbd67;color:#fff}.deadline-tab .tab-name{min-height:48px;font-size:19px;font-weight:1000;line-height:1.3}.deadline-tab .tab-count{display:block;margin-top:8px;font-size:32px;font-weight:1000;color:#075fb5}.deadline-tab .tab-points{display:block;margin-top:4px;font-size:23px;font-weight:1000;color:#d51f2f}.deadline-tab.critical .tab-count{color:#fff16b}.deadline-tab.critical .tab-points{color:#c9f7ff}.deadline-tab input{width:100%;margin-top:7px;padding:7px;border:1px solid #5794aa;border-radius:7px;font-weight:900}
.kpis{display:none!important}.kpi{min-height:140px;padding:16px;border:2px solid color-mix(in srgb,var(--c) 72%,#fff);border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 28%,#0a2940),#08263bd9);box-shadow:0 5px 0 #031727,0 0 16px color-mix(in srgb,var(--c) 38%,transparent)}.kpi small{font-size:16px;font-weight:900;color:#d8f6ff}.kpi strong{display:block;margin-top:9px;font-size:38px;color:var(--c);text-shadow:0 0 13px var(--c)}.kpi em{font-style:normal;font-size:18px;font-weight:900}
.controls{display:grid;grid-template-columns:minmax(280px,1fr) 260px auto;gap:10px;margin-top:14px;padding:12px;border:2px solid #6edcf1;border-radius:15px;background:#082d45dc}.controls input,.controls select{min-width:0;padding:13px 15px;border:1px solid #86dff1;border-radius:10px;background:#f5fcff;color:#13293a;font-size:17px;font-weight:800}
.process-deck{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:14px;padding:13px;border:3px solid #9cdff0;border-radius:19px;background:#263c48e8;box-shadow:0 7px 0 #071a25,inset 0 1px 0 #ffffff55}.process-card{--pc:#42a5f5;position:relative;min-height:225px;padding:10px;border:3px solid var(--pc);border-radius:17px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--pc) 13%,#fff));box-shadow:0 5px 0 color-mix(in srgb,var(--pc) 65%,#273746);color:#17212b;cursor:pointer;text-align:center;transition:.16s}.process-card:hover,.process-card.active{transform:translateY(-4px);box-shadow:0 7px 0 color-mix(in srgb,var(--pc) 65%,#273746),0 0 20px var(--pc)}.process-name{display:grid;place-items:center;min-height:48px;padding:6px;border-radius:11px;background:var(--pc);color:#fff;font-size:24px;font-weight:1000;text-shadow:0 2px 2px #0006}.process-count{display:block;margin-top:10px;font-size:31px;font-weight:1000;color:color-mix(in srgb,var(--pc) 82%,#17212b)}.process-icon{width:92px;height:82px;display:grid;place-items:center;margin:17px auto 3px;border:3px solid var(--pc);border-radius:19px;background:#ffffffd9;color:var(--pc);font-size:48px;font-weight:1000;box-shadow:0 5px 10px color-mix(in srgb,var(--pc) 28%,transparent)}.process-card.active:after{content:"表示中";display:inline-block;margin-top:5px;padding:3px 10px;border-radius:99px;background:var(--pc);color:#fff;font-size:12px;font-weight:1000}.process-card.zero .process-count,.process-card.zero .process-icon{display:none}.process-card.zero:before{content:"完了";display:grid;place-items:center;width:105px;height:76px;margin:42px auto 0;border:5px double #fff;border-radius:5px;background:#26343b;color:#fff;font-size:34px;font-weight:1000;line-height:1;transform:rotate(-6deg);box-shadow:0 6px 12px #0005,0 0 0 3px #26343b}.process-card.zero{background:linear-gradient(180deg,#52636c,#34434b);border-color:#26343b;box-shadow:0 5px 0 #17242a}.process-card.zero .process-name{background:#26343b}.process-card.zero.active:after{display:none}
.deadline-tab{position:relative}
.deadline-tab.active:after,.process-card.active:after{
  content:"表示中"!important;
  position:absolute!important;
  z-index:6;
  display:grid!important;
  place-items:center;
  width:118px;
  height:43px;
  padding:0!important;
  border:4px double #fff!important;
  border-radius:5px!important;
  background:#10a84f!important;
  color:#fff!important;
  font-size:21px!important;
  font-weight:1000!important;
  line-height:1!important;
  letter-spacing:.08em;
  text-shadow:0 2px 2px #075c2d;
  box-shadow:0 5px 0 #087436,0 0 15px #20ef77!important;
}
.deadline-tab.active:after{right:12px;top:11px;transform:rotate(3deg)}
.process-card.active:after{left:50%;bottom:10px;margin:0!important;transform:translateX(-50%) rotate(-3deg)}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.group{border:3px solid var(--group);border-radius:20px;overflow:hidden;background:#082a40e8;box-shadow:0 7px 0 #031724,0 0 24px color-mix(in srgb,var(--group) 42%,transparent)}.group-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:linear-gradient(90deg,color-mix(in srgb,var(--group) 72%,#151515),color-mix(in srgb,var(--group) 28%,#071e31))}.group-head h2{margin:0;font-size:32px}.group-head strong{font-size:27px;color:#fff8a6}.group-body{padding:14px}
.color-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:14px}.color-chip{position:relative;min-height:94px;display:grid;grid-template-columns:62px 1fr;align-items:center;gap:9px;padding:8px;border:1px solid #8ddff0;border-radius:12px;background:#ffffff13;color:#fff;text-align:left;cursor:pointer;transition:.16s}.color-chip:hover,.color-chip.selected{transform:translateY(-3px);border-color:#52ff9a;box-shadow:0 0 18px #20e778}.color-chip.selected:after{content:"表示中";position:absolute;right:5px;top:5px;padding:3px 7px;border:2px double #fff;border-radius:4px;background:#10a84f;color:#fff;font-size:10px;font-weight:1000;box-shadow:0 2px 0 #087436}.swatch{width:62px;height:62px;border:3px solid #fff;border-radius:12px;box-shadow:0 0 13px currentColor}.color-chip b{font-size:18px}.color-chip small{display:block;margin-top:4px;color:#c8eaf4;font-weight:800}
.table-wrap{max-height:530px;overflow:auto;border:1px solid #5c9db5;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:900px;background:#f8fcff;color:#102738}thead{position:sticky;top:0;z-index:2;background:#0c5878;color:#fff}th,td{padding:10px 9px;border-bottom:1px solid #c7dce5;text-align:left}th{font-size:15px}td{font-size:14px}tbody tr:hover{background:#e0f6ff}.id{font-weight:1000;color:#075b91;white-space:nowrap}.check-col{width:62px;text-align:center}.job-check{width:27px;height:27px;accent-color:#00b86b;cursor:pointer}.done-row{background:#26343b!important;color:#c1ccd2!important;opacity:.78}.done-row:hover{background:#1d292f!important}.done-row .id{color:#8fadb9!important;text-decoration:line-through}.done-row td{border-bottom-color:#455862}.done-row b,.done-row .munsell{color:#c1ccd2!important}.munsell{display:inline-flex;align-items:center;gap:7px;font-weight:1000}.munsell i{width:28px;height:28px;border:2px solid #405866;border-radius:6px}.empty{padding:38px;text-align:center;color:#bdddea;font-size:22px;font-weight:900}
.other{margin-top:16px;border:2px solid #94a3b8;border-radius:16px;background:#102d40e8;padding:14px}.other h2{margin:0 0 10px;font-size:24px}.foot{margin:16px 0 4px;text-align:center;color:#b8dce9;font-weight:800}
@media(max-width:1300px){.deadline-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.process-deck{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,1fr)}.groups{grid-template-columns:1fr}}@media(max-width:700px){.app{padding:8px}.top{align-items:flex-start}.title h1{font-size:25px}.actions{flex-direction:column}.deadline-tabs{grid-template-columns:1fr}.process-deck{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title"><div class="logo">🎨</div><div><h1>塗装工程ダッシュボード</h1><p>錆止め・焼付・マンセル色を一画面で確認</p></div></div>
    <div class="actions"><a class="btn" href="index.html">← ダッシュボード</a><button class="btn" id="reload">CSV更新</button></div>
  </header>
  <section class="mission"><b>🔥 色と品質に、九州工場の誇りを込めよう！</b><span id="missionText">塗装工程を読み込んでいます。</span></section>
  <section class="deadline-tabs">
    <button class="deadline-tab" data-deadline="tomorrow"><span class="tab-name">明日期限</span><span class="tab-count" id="tomorrowCount">0件</span><span class="tab-points" id="tomorrowPoints">0点</span></button>
    <button class="deadline-tab" data-deadline="day2"><span class="tab-name">明後日期限</span><span class="tab-count" id="day2Count">0件</span><span class="tab-points" id="day2Points">0点</span></button>
    <button class="deadline-tab" data-deadline="day3"><span class="tab-name">3日後期限</span><span class="tab-count" id="day3Count">0件</span><span class="tab-points" id="day3Points">0点</span></button>
    <button class="deadline-tab critical active" data-deadline="critical"><span class="tab-name">本日期限未完成<br>・製造期限切れ</span><span class="tab-count" id="criticalCount">0件</span><span class="tab-points" id="criticalPoints">0点</span></button>
    <button class="deadline-tab" data-deadline="specified"><span class="tab-name">指定日製造期限</span><span class="tab-count" id="specifiedCount">0件</span><span class="tab-points" id="specifiedPoints">0点</span><input id="specifiedDate" type="date"></button>
  </section>
  <section class="kpis">
    <div class="kpi" style="--c:#42e8ff"><small>塗装対象 合計</small><strong id="totalCount">0件</strong><em id="totalQty">0点</em></div>
    <div class="kpi" style="--c:#ff684d"><small>錆止め</small><strong id="rustCount">0件</strong><em id="rustQty">0点</em></div>
    <div class="kpi" style="--c:#b18aff"><small>焼付</small><strong id="bakeCount">0件</strong><em id="bakeQty">0点</em></div>
    <div class="kpi" style="--c:#ffd34f"><small>マンセル値 登録</small><strong id="colorCount">0件</strong><em id="colorRate">0.0%</em></div>
    <div class="kpi" style="--c:#96a6b5"><small>その他</small><strong id="otherCount">0件</strong><em id="otherQty">0点</em></div>
  </section>
  <section class="process-deck">
    <button class="process-card" data-process="未着手" style="--pc:#78909c"><span class="process-name">未着手</span><span class="process-count">0件</span><span class="process-icon">○</span></button>
    <button class="process-card" data-process="CAD/CAM" style="--pc:#f4c430"><span class="process-name">CAD/CAM</span><span class="process-count">0件</span><span class="process-icon">▣</span></button>
    <button class="process-card" data-process="切断" style="--pc:#f57c00"><span class="process-name">切断</span><span class="process-count">0件</span><span class="process-icon">◉</span></button>
    <button class="process-card" data-process="曲げ" style="--pc:#ec6cb9"><span class="process-name">曲げ</span><span class="process-count">0件</span><span class="process-icon">↪</span></button>
    <button class="process-card" data-process="溶接" style="--pc:#e53935"><span class="process-name">溶接</span><span class="process-count">0件</span><span class="process-icon">⚡</span></button>
    <button class="process-card" data-process="仕上" style="--pc:#90a4ae"><span class="process-name">仕上</span><span class="process-count">0件</span><span class="process-icon">✦</span></button>
    <button class="process-card" data-process="塗装" style="--pc:#43a047"><span class="process-name">塗装</span><span class="process-count">0件</span><span class="process-icon">▥</span></button>
  </section>
  <main class="groups">
    <section class="group" style="--group:var(--rust)"><header class="group-head"><h2>🛡 錆止め</h2><strong id="rustHead">0件・0点</strong></header><div class="group-body"><div class="table-wrap" id="rustTable"></div></div></section>
    <section class="group" style="--group:var(--bake)"><header class="group-head"><h2>🔥 焼付</h2><strong id="bakeHead">0件・0点</strong></header><div class="group-body"><div class="color-summary" id="bakeColors"></div><div class="table-wrap" id="bakeTable"></div></div></section>
  </main>
  <section class="other"><h2>その他の塗装対象 <span id="otherHead">0件・0点</span></h2><div class="table-wrap" id="otherTable"></div></section>
  <div class="foot">※ 錆止め・焼付の指定、または色・マンセル値が登録されている製造指示のみ塗装対象に含みます。いずれも登録されていない指示は対象外です。画面の色は近似表示のため、最終確認には正式な色見本を使用してください。</div>
</div>
<script>
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('ja-JP');
let paintRows=[],deadlineFilter='critical',specifiedDate='',processFilter='',colorFilter='';
const DONE_STORAGE_KEY='paintingCompletedJNumbers';
let completedJobs=new Set();
try{completedJobs=new Set(JSON.parse(localStorage.getItem(DONE_STORAGE_KEY)||'[]'))}catch(e){completedJobs=new Set()}
function saveCompletedJobs(){localStorage.setItem(DONE_STORAGE_KEY,JSON.stringify([...completedJobs]))}
function shortJNumber(value){
  const raw=String(value||'').trim();
  const match=raw.match(/^\d{2}-(J.+)-\d{3}$/);
  return match?match[1]:raw;
}
function localDate(offset=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function rowsForDeadline(rows,key){
  const today=localDate(0),dates={tomorrow:localDate(1),day2:localDate(2),day3:localDate(3),specified:specifiedDate};
  const dueOf=r=>String(r['製造期限']||'').trim().replaceAll('/','-');
  if(key==='critical')return rows.filter(r=>dueOf(r)&&dueOf(r)<=today);
  return rows.filter(r=>dueOf(r)===dates[key]);
}
function cleanHeader(value){
  return String(value||'').replace(/^\uFEFF/,'').normalize('NFKC').trim().replace(/[　\s]+/g,'');
}
function parseCsv(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
    if(c==='"'&&quoted&&n==='"'){cell+='"';i++}
    else if(c==='"'){quoted=!quoted}
    else if(c===','&&!quoted){row.push(cell);cell=''}
    else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];cell=''}
    else cell+=c
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  const headers=(rows.shift()||[]).map(cleanHeader);
  return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]||''])));
}
function decodeCsvBuffer(buffer){
  const bytes=new Uint8Array(buffer);
  const utf8=new TextDecoder('utf-8',{fatal:false}).decode(bytes).replace(/^\uFEFF/,'');
  const badUtf8=(utf8.match(/\uFFFD/g)||[]).length;
  if(badUtf8===0)return utf8;
  try{
    const sjis=new TextDecoder('shift-jis',{fatal:false}).decode(bytes).replace(/^\uFEFF/,'');
    const badSjis=(sjis.match(/\uFFFD/g)||[]).length;
    return badSjis<badUtf8?sjis:utf8;
  }catch(_){return utf8}
}
function typeOf(row){
  const text=`${row['品名']||''} ${row['規格']||''}`;
  if(/さび止め|錆止め|サビ止め|防錆/.test(text))return 'rust';
  if(/焼付|焼き付|焼付け/.test(text))return 'bake';
  return 'other';
}
function cleanColor(value){return String(value||'').replace(/[（(]?近似色[）)]?/g,'').replace(/全ﾂﾔ|3分ﾂﾔ/g,'').trim()}
function munsellColor(value){
  const raw=cleanColor(value).toUpperCase();
  if(!raw)return '#d9e1e5';
  const neutral=raw.match(/^N-?([0-9.]+)/);
  if(neutral){const light=Math.max(5,Math.min(98,Number(neutral[1])<=10?Number(neutral[1])*10:Number(neutral[1])));return `hsl(210 3% ${light}%)`}
  const m=raw.match(/^([0-9.]+)(R|YR|Y|GY|G|BG|B|PB|P|RP)\s*([0-9.]+)\/([0-9.]+)/);
  if(m){const hueBase={R:0,YR:30,Y:55,GY:90,G:130,BG:170,B:210,PB:245,P:280,RP:325}[m[2]];const hue=(hueBase+(Number(m[1])-5)*2+360)%360;const light=Math.max(8,Math.min(95,Number(m[3])*10));const sat=Math.max(3,Math.min(88,Number(m[4])*8));return `hsl(${hue} ${sat}% ${light}%)`}
  if(/^22-85C/.test(raw))return '#d9d6b7';
  return '#a9b3ba';
}
function qty(rows){return rows.reduce((s,r)=>s+(Number(String(r['数量']).replace(/,/g,''))||0),0)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function colorCards(rows){
  const map=new Map();
  rows.forEach(r=>{const name=cleanColor(r['色'])||'色未登録';if(!map.has(name))map.set(name,{count:0,qty:0});const x=map.get(name);x.count++;x.qty+=Number(String(r['数量']).replace(/,/g,''))||0});
  return [...map.entries()].sort((a,b)=>b[1].count-a[1].count).slice(0,12).map(([name,x])=>`<button type="button" class="color-chip ${colorFilter===name?'selected':''}" data-color="${esc(name)}"><i class="swatch" style="background:${munsellColor(name)};color:${munsellColor(name)}"></i><span><b>${esc(name)}</b><small>${fmt(x.count)}件・${fmt(x.qty)}点</small></span></button>`).join('');
}
function table(rows,showColor=true){
  if(!rows.length)return '<div class="empty">対象データはありません</div>';
  const colorHead=showColor?'<th>マンセル値</th>':'';
  return `<table><thead><tr><th class="check-col">完了</th><th>J番号</th><th>品番・品名</th><th>規格</th>${colorHead}<th>数量</th><th>現在工程</th><th>製造期限</th><th>出荷日</th><th>担当者</th></tr></thead><tbody>${rows.slice(0,300).map(r=>{const color=cleanColor(r['色']),job=shortJNumber(r['製造指示番号']),done=completedJobs.has(job);const colorCell=showColor?`<td><span class="munsell"><i style="background:${munsellColor(color)}"></i>${esc(color||'未登録')}</span></td>`:'';return `<tr class="${done?'done-row':''}" data-job-row="${esc(job)}"><td class="check-col"><input class="job-check" type="checkbox" data-job="${esc(job)}" ${done?'checked':''} aria-label="${esc(job)} 完了"></td><td class="id">${esc(job)}</td><td><b>${esc(r['品番'])}</b><br>${esc(r['品名'])}</td><td>${esc(r['規格'])}</td>${colorCell}<td><b>${fmt(r['数量'])}点</b></td><td><b>${esc(r['進捗']||'未着手')}</b></td><td>${esc(r['製造期限'])}</td><td><b>${esc(r['出荷日']||'未設定')}</b></td><td>${esc(r['担当者']||'未設定')}</td></tr>`}).join('')}</tbody></table>`;
}
function render(){
  const deadlineRows=rowsForDeadline(paintRows,deadlineFilter);
  const filtered=deadlineRows.filter(r=>!processFilter||String(r['進捗']||'').trim()===processFilter);
  const rust=filtered.filter(r=>typeOf(r)==='rust'),bakeAll=filtered.filter(r=>typeOf(r)==='bake'),other=filtered.filter(r=>typeOf(r)==='other');
  const bake=colorFilter?bakeAll.filter(r=>(cleanColor(r['色'])||'色未登録')===colorFilter):bakeAll;
  const set=(id,v)=>$(id).textContent=v;
  set('totalCount',`${fmt(filtered.length)}件`);set('totalQty',`${fmt(qty(filtered))}点`);
  set('rustCount',`${fmt(rust.length)}件`);set('rustQty',`${fmt(qty(rust))}点`);
  set('bakeCount',`${fmt(bake.length)}件`);set('bakeQty',`${fmt(qty(bake))}点`);
  set('otherCount',`${fmt(other.length)}件`);set('otherQty',`${fmt(qty(other))}点`);
  const colorTargets=[...bake,...other],colored=colorTargets.filter(r=>cleanColor(r['色'])).length;set('colorCount',`${fmt(colored)}件`);set('colorRate',`${colorTargets.length?(colored/colorTargets.length*100).toFixed(1):'0.0'}%`);
  set('rustHead',`${fmt(rust.length)}件・${fmt(qty(rust))}点`);set('bakeHead',`${fmt(bake.length)}件・${fmt(qty(bake))}点`);set('otherHead',`${fmt(other.length)}件・${fmt(qty(other))}点`);
  $('bakeColors').innerHTML=colorCards(bakeAll);
  $('rustTable').innerHTML=table(rust,false);$('bakeTable').innerHTML=table(bake,true);$('otherTable').innerHTML=table(other,true);
  const filterNames={tomorrow:'明日期限',day2:'明後日期限',day3:'3日後期限',critical:'本日期限未完成・製造期限切れ',specified:`指定日 ${specifiedDate||'未選択'}`};
  $('missionText').textContent=colorFilter
    ? `${filterNames[deadlineFilter]}・色 ${colorFilter} を表示中：焼付${fmt(bake.length)}件・${fmt(qty(bake))}点です。`
    : `${filterNames[deadlineFilter]}は全${fmt(filtered.length)}件・${fmt(qty(filtered))}点。錆止め${fmt(rust.length)}件、焼付${fmt(bake.length)}件です。色・数量・期限を確認して確実に仕上げましょう！`;
  [['tomorrow','tomorrow'],['day2','day2'],['day3','day3'],['critical','critical'],['specified','specified']].forEach(([key,id])=>{
    const list=rowsForDeadline(paintRows,key);$(`${id}Count`).textContent=`${fmt(list.length)}件`;$(`${id}Points`).textContent=`${fmt(qty(list))}点`;
  });
  document.querySelectorAll('.deadline-tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.deadline===deadlineFilter));
  document.querySelectorAll('.process-card').forEach(card=>{
    const count=deadlineRows.filter(r=>String(r['進捗']||'').trim()===card.dataset.process).length;
    card.querySelector('.process-count').textContent=`${fmt(count)}件`;
    card.classList.toggle('zero',count===0);
    card.classList.toggle('active',card.dataset.process===processFilter);
  });
}
function loadText(text){
  const all=parseCsv(String(text||'').replace(/^\uFEFF/,''));
  const required=['製造指示番号','品番','品名','数量','規格','進捗','製造期限'];
  const available=all.length?Object.keys(all[0]):[];
  const missing=required.filter(name=>!available.includes(name));
  if(missing.length)throw new Error('列が見つかりません: '+missing.join('、'));
  paintRows=all.filter(r=>{
    const status=String(r['進捗']||'').trim();
    const materialText=`${r['品名']||''} ${r['規格']||''}`.toUpperCase();
    const hasColor=Boolean(cleanColor(r['色']));
    const hasRust=/さび止め|錆止め|サビ止め|防錆/.test(materialText);
    const hasBake=/焼付|焼き付|焼付け/.test(materialText);
    const needsPainting=hasRust||hasBake||hasColor;
    return status!=='組立'&&status!=='完成'&&!status.includes('キャンセル')&&!status.includes('ｷｬﾝｾﾙ')&&needsPainting;
  });
  render();
}
async function autoLoad(){
  try{
    const res=await fetch('SCV.csv?ts='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('SCV.csvが見つかりません');
    const text=decodeCsvBuffer(await res.arrayBuffer());
    loadText(text);
  }catch(e){
    $('missionText').textContent='⚠ '+(e?.message||'SCV.csvを読み込めませんでした。');
  }
}
$('reload').onclick=autoLoad;
$('specifiedDate').value=localDate(4);specifiedDate=$('specifiedDate').value;
document.querySelectorAll('.deadline-tab').forEach(tab=>tab.addEventListener('click',event=>{
  if(event.target.closest('input'))return;
  deadlineFilter=tab.dataset.deadline;
  colorFilter='';
  render();
}));
$('specifiedDate').addEventListener('click',event=>event.stopPropagation());
$('specifiedDate').addEventListener('change',event=>{
  specifiedDate=event.target.value;
  deadlineFilter='specified';
  colorFilter='';
  render();
});
document.querySelectorAll('.process-card').forEach(card=>card.addEventListener('click',()=>{
  processFilter=processFilter===card.dataset.process?'':card.dataset.process;
  colorFilter='';
  render();
}));
document.addEventListener('click',event=>{
  const chip=event.target.closest('.color-chip');
  if(!chip)return;
  colorFilter=colorFilter===chip.dataset.color?'':chip.dataset.color;
  render();
  $('bakeTable').scrollIntoView({behavior:'smooth',block:'start'});
});

document.addEventListener('change',event=>{
  const checkbox=event.target.closest('.job-check');
  if(!checkbox)return;
  const job=checkbox.dataset.job;
  if(checkbox.checked)completedJobs.add(job);else completedJobs.delete(job);
  saveCompletedJobs();
  document.querySelectorAll('.job-check').forEach(item=>{
    if(item.dataset.job!==job)return;
    item.checked=checkbox.checked;
    item.closest('tr')?.classList.toggle('done-row',checkbox.checked);
  });
});
autoLoad();setInterval(autoLoad,30000);
</script>
</body>
</html>
