<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新世界｜溶接工程</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--red:#e53935;--orange:#f57c00;--pink:#ec6cb9;--yellow:#f4c430;--ink:#17212b;--line:#d8e0e6;--glass:rgba(255,255,255,.93)}
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:#111923;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 78% 22%,rgba(255,101,35,.42),transparent 22%),linear-gradient(rgba(8,14,21,.48),rgba(8,14,21,.78)),repeating-linear-gradient(135deg,#26313d 0 28px,#1b2530 28px 56px)}
body:after{content:"⚡";position:fixed;right:8%;top:18%;z-index:-1;font-size:280px;color:#ff7b37;opacity:.12;filter:drop-shadow(0 0 35px #ff5a28)}
header{height:74px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,rgba(30,22,22,.97),rgba(80,24,18,.94));border-bottom:2px solid #b53c29;color:#fff}
header h1{margin:0;font-size:25px}header p{margin:4px 0 0;color:#ffc8bb;font-size:13px}.actions{display:flex;gap:9px}.btn{padding:10px 15px;border-radius:9px;border:1px solid #ffffff55;background:#ffffff12;color:#fff;text-decoration:none;cursor:pointer}.btn.primary{background:#d73b25;border-color:#ef6d57}
main{padding:18px 22px 30px;min-height:calc(100vh - 74px)}
.notice{display:flex;justify-content:space-between;gap:15px;padding:10px 14px;margin-bottom:14px;border-radius:10px;background:rgba(91,29,23,.9);border:1px solid #e06750;color:#ffe5de}
.date-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.date-tab{position:relative;padding:14px 16px;border:2px solid rgba(255,255,255,.32);border-radius:14px;background:rgba(20,31,42,.88);color:#fff;text-align:left;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.32)}.date-tab:hover,.date-tab.active{border-color:#ff7452;box-shadow:0 0 0 3px rgba(255,92,53,.23),0 5px 0 rgba(0,0,0,.32)}.date-tab .label{font-size:18px;font-weight:900}.date-tab .date{margin-top:4px;color:#ffcabd}.date-tab .count{position:absolute;right:15px;top:15px;font-size:27px;font-weight:900}.date-tab input{width:100%;margin-top:8px;padding:7px;border:0;border-radius:6px}
.process-board{padding:16px;border:1px solid rgba(255,255,255,.35);border-radius:18px;background:rgba(242,247,250,.94);box-shadow:0 14px 40px rgba(0,0,0,.3)}
.board-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.board-title h2{margin:0;font-size:18px}.board-title span{color:#61707e;font-size:13px}
.process-grid{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr));gap:10px}.process-card{--c:#607d8b;position:relative;min-height:145px;padding:9px;border:3px solid var(--c);border-radius:15px;background:#fff;text-align:center;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 65%,#263238);transition:.18s}.process-card:hover,.process-card.active{transform:translateY(-3px);box-shadow:0 9px 0 color-mix(in srgb,var(--c) 65%,#263238)}.process-card .head{padding:8px 5px;border-radius:8px;background:var(--c);color:#fff;font-size:16px;font-weight:900}.process-card .value{font-size:27px;font-weight:1000;margin-top:18px}.process-card .sub{font-size:12px;color:#65727d}.process-card .bar{height:7px;margin:17px 10px 0;border-radius:9px;background:#e1e7e9;overflow:hidden}.process-card .fill{height:100%;background:var(--c)}
.process-card.total{--c:#19738c}.process-card.p0{--c:#d4a900}.process-card.p1{--c:#e46e00}.process-card.p2{--c:#d856a5}.process-card.p3{--c:#d93632}.process-card.disabled{--c:#77838e;cursor:not-allowed;filter:grayscale(.25);background:#e9edf0}.process-card.disabled:hover{transform:none;box-shadow:0 6px 0 #4d5861}.stamp{position:absolute;left:50%;top:63%;transform:translate(-50%,-50%) rotate(-10deg);padding:5px 10px;border:4px double #b3261e;border-radius:7px;color:#b3261e;background:rgba(255,255,255,.82);font-size:22px;font-weight:1000;letter-spacing:.1em}
.product-area{margin-top:16px;min-height:380px;padding:17px;border:1px solid rgba(255,255,255,.34);border-radius:18px;background:rgba(11,25,36,.82);backdrop-filter:blur(8px);color:#fff}.product-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.product-head h2{margin:0;font-size:25px}.product-head p{margin:3px 0 0;color:#b9ced9}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.product-card{position:relative;min-height:150px;padding:17px;border:2px solid rgba(255,255,255,.36);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(232,240,245,.94));color:#17212b;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:.18s}.product-card:hover{transform:translateY(-4px);border-color:#ff7654}.product-name{font-size:20px;font-weight:1000;line-height:1.25}.product-part{margin-top:7px;color:#416277;font-weight:700}.product-meta{display:flex;justify-content:space-between;align-items:end;margin-top:20px}.product-count{font-size:26px;font-weight:1000;color:#d93c27}.product-qty{font-size:15px;color:#5d6b75}.empty{grid-column:1/-1;display:grid;place-items:center;min-height:280px;border:2px dashed rgba(255,255,255,.35);border-radius:15px;color:#c5d4dc;font-size:21px;font-weight:800}
.modal{display:none;position:fixed;inset:0;z-index:20;padding:25px;background:rgba(0,0,0,.72);align-items:center;justify-content:center}.modal.show{display:flex}.modal-card{width:min(1050px,96vw);max-height:90vh;overflow:auto;border-radius:19px;background:#fff;box-shadow:0 25px 80px #000;padding:20px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:13px}.modal-head h3{margin:0;font-size:25px}.close{border:0;background:#e9eef1;border-radius:9px;padding:8px 13px;font-size:18px;cursor:pointer}.detail-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.detail-box{padding:12px;border:1px solid var(--line);border-radius:10px;background:#f7fafb}.detail-box small{color:#6d7b86}.detail-box b{display:block;margin-top:4px;font-size:18px}.detail-list{display:grid;gap:8px}.detail-row{display:grid;grid-template-columns:1.2fr 1fr 1.6fr .6fr 1fr 1fr;gap:8px;padding:10px;border-bottom:1px solid #e7ecef;align-items:center}.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#ffe3df;color:#aa2c20;font-weight:800;text-align:center}
@media(max-width:1250px){.process-grid{grid-template-columns:repeat(4,1fr)}.date-tabs{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){header{height:auto;padding:14px;align-items:flex-start}header p{display:none}.actions{flex-direction:column}.date-tabs{grid-template-columns:1fr 1fr}.process-grid{grid-template-columns:1fr 1fr}.detail-summary{grid-template-columns:1fr 1fr}.detail-row{grid-template-columns:1fr}.product-grid{grid-template-columns:1fr}main{padding:12px}.date-tab .count{font-size:21px}}
</style>
</head>
<body>
<header><div><h1>🔥 溶接工程ボード</h1><p>生地日を基準に、CAD/CAMから溶接までを管理</p></div><div class="actions"><a class="btn" href="index.html">← 新世界へ戻る</a><button class="btn primary" id="refresh">更新</button></div></header>
<main>
<div class="notice" id="notice"><span>SCV.csvを読み込み中です。</span><button onclick="this.parentElement.remove()">×</button></div>
<section class="date-tabs">
<button class="date-tab active" data-date-mode="today"><div class="label">今日生地</div><div class="date" id="dateToday"></div><div class="count" id="countToday">0</div></button>
<button class="date-tab" data-date-mode="tomorrow"><div class="label">明日生地</div><div class="date" id="dateTomorrow"></div><div class="count" id="countTomorrow">0</div></button>
<button class="date-tab" data-date-mode="after"><div class="label">明後日生地</div><div class="date" id="dateAfter"></div><div class="count" id="countAfter">0</div></button>
<button class="date-tab" data-date-mode="specified"><div class="label">指定日生地日</div><input type="date" id="specifiedDate"><div class="count" id="countSpecified">0</div></button>
</section>
<section class="process-board"><div class="board-title"><h2>工程進捗</h2><span>工程を選択すると品名別に表示します</span></div><div class="process-grid" id="processGrid"></div></section>
<section class="product-area"><div class="product-head"><div><h2 id="productTitle">全体・品名一覧</h2><p id="productSub">品名をクリックすると詳細を表示します</p></div><b id="resultSummary">0件</b></div><div class="product-grid" id="productGrid"></div></section>
</main>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><div><h3 id="modalTitle"></h3><div id="modalPart"></div></div><button class="close" id="closeModal">×</button></div><div class="detail-summary" id="detailSummary"></div><div class="detail-list" id="detailList"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('ja-JP');
let rows=[],dateMode='today',selectedProcess='全体';
const processOrder=['CAD/CAM','切断','曲げ','溶接'];
const allCards=['全体','CAD/CAM','切断','曲げ','溶接','仕上げ','塗装','組立'];
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dates(){const t=new Date();t.setHours(0,0,0,0);const d1=new Date(t),d2=new Date(t);d1.setDate(t.getDate()+1);d2.setDate(t.getDate()+2);return{today:localDate(t),tomorrow:localDate(d1),after:localDate(d2)}}
function excelDate(v){if(!v)return'';if(v instanceof Date)return localDate(v);if(typeof v==='number')return localDate(new Date(Math.round((v-25569)*86400000)));const s=String(v).trim().replaceAll('/','-');let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:s.slice(0,10)}
function normalize(o){return{id:String(o['製造指示番号']||'').trim(),part:String(o['品番']||'').trim(),name:String(o['品名']||'').trim()||'品名未設定',standard:String(o['規格']||'').trim(),qty:Number(String(o['数量']||0).replaceAll(',',''))||0,materialDate:excelDate(o['生地日']),shipDate:excelDate(o['出荷日']),due:excelDate(o['製造期限']),status:String(o['進捗']||'').trim(),owner:String(o['担当者']||'').trim(),ship:String(o['配送便']||'').trim()}}
function selectedDate(){const ds=dates();return dateMode==='specified'?$('specifiedDate').value:ds[dateMode]}
function stageIndex(s){return processOrder.indexOf(s)}
function baseRowsForDate(date){return rows.filter(r=>r.materialDate===date&&!r.status.includes('ｷｬﾝｾﾙ')&&!r.status.includes('キャンセル'))}
function processRows(base,p){if(p==='全体')return base.filter(r=>stageIndex(r.status)>=0);return base.filter(r=>r.status===p)}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function updateDateLabels(){const ds=dates();$('dateToday').textContent=ds.today;$('dateTomorrow').textContent=ds.tomorrow;$('dateAfter').textContent=ds.after;if(!$('specifiedDate').value)$('specifiedDate').value=ds.today;for(const [key,id] of [['today','countToday'],['tomorrow','countTomorrow'],['after','countAfter']])$(id).textContent=fmt(baseRowsForDate(ds[key]).filter(r=>stageIndex(r.status)>=0).length);$('countSpecified').textContent=fmt(baseRowsForDate($('specifiedDate').value).filter(r=>stageIndex(r.status)>=0).length)}
function renderProcesses(){const base=baseRowsForDate(selectedDate());const relevant=base.filter(r=>stageIndex(r.status)>=0);const max=Math.max(1,...processOrder.map(p=>base.filter(r=>r.status===p).length));$('processGrid').innerHTML=allCards.map((p,i)=>{const disabled=i>=5;const count=p==='全体'?relevant.length:disabled?0:base.filter(r=>r.status===p).length;const qty=p==='全体'?relevant.reduce((a,r)=>a+r.qty,0):disabled?0:base.filter(r=>r.status===p).reduce((a,r)=>a+r.qty,0);const cls=p==='全体'?'total':i>0&&i<5?`p${i-1}`:'';return `<button class="process-card ${cls} ${disabled?'disabled':''} ${selectedProcess===p?'active':''}" data-process="${p}" ${disabled?'disabled':''}><div class="head">${p}</div>${disabled?'<div class="stamp">対象外</div>':`<div class="value">${fmt(count)}件</div><div class="sub">${fmt(qty)}点</div><div class="bar"><div class="fill" style="width:${p==='全体'?100:count/max*100}%"></div></div>`}</button>`}).join('')}
function renderProducts(){const base=baseRowsForDate(selectedDate());const data=processRows(base,selectedProcess);const groups=new Map();data.forEach(r=>{const key=`${r.name}|||${r.part}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});$('productTitle').textContent=`${selectedProcess}・品名一覧`;$('productSub').textContent=`生地日 ${selectedDate()} ／ 品名をクリックすると詳細を表示します`;$('resultSummary').textContent=`${fmt(data.length)}件・${fmt(data.reduce((a,r)=>a+r.qty,0))}点`;$('productGrid').innerHTML=groups.size?[...groups.entries()].map(([key,list])=>{const [name,part]=key.split('|||');return `<button class="product-card" data-key="${escapeHtml(key)}"><div class="product-name">${escapeHtml(name)}</div><div class="product-part">${escapeHtml(part||'品番なし')}</div><div class="product-meta"><div class="product-count">${fmt(list.length)}件</div><div class="product-qty">${fmt(list.reduce((a,r)=>a+r.qty,0))}点</div></div></button>`}).join(''):'<div class="empty">対象データはありません</div>'}
function render(){updateDateLabels();renderProcesses();renderProducts();document.querySelectorAll('.date-tab').forEach(b=>b.classList.toggle('active',b.dataset.dateMode===dateMode))}
function openDetails(key){const base=processRows(baseRowsForDate(selectedDate()),selectedProcess);const [name,part]=key.split('|||');const list=base.filter(r=>r.name===name&&r.part===part);$('modalTitle').textContent=name;$('modalPart').textContent=part||'品番なし';$('detailSummary').innerHTML=`<div class="detail-box"><small>対象件数</small><b>${fmt(list.length)}件</b></div><div class="detail-box"><small>合計数量</small><b>${fmt(list.reduce((a,r)=>a+r.qty,0))}点</b></div><div class="detail-box"><small>生地日</small><b>${selectedDate()}</b></div><div class="detail-box"><small>選択工程</small><b>${selectedProcess}</b></div>`;$('detailList').innerHTML=list.map(r=>`<div class="detail-row"><b>${escapeHtml(r.id)}</b><span>${escapeHtml(r.standard||'-')}</span><span>${escapeHtml(r.name)}</span><b>${fmt(r.qty)}点</b><span class="status">${escapeHtml(r.status)}</span><span>${escapeHtml(r.owner||'未設定')}</span></div>`).join('');$('modal').classList.add('show')}
async function loadCSV(){try{const res=await fetch('SCV.csv?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error();const buf=await res.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const sheet=wb.Sheets[wb.SheetNames[0]];const raw=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false,dateNF:'yyyy-mm-dd'});rows=raw.map(normalize).filter(r=>r.id&&r.materialDate);$('notice').innerHTML=`<span>✓ SCV.csvから${fmt(rows.length)}件を読み込みました。生地日で表示しています。</span><button onclick="this.parentElement.remove()">×</button>`;render()}catch(e){$('notice').innerHTML='<span>⚠ SCV.csvを読み込めません。ファイル名と「生地日」列を確認してください。</span><button onclick="this.parentElement.remove()">×</button>';render()}}
document.addEventListener('click',e=>{const tab=e.target.closest('.date-tab');if(tab&&!e.target.matches('input')){dateMode=tab.dataset.dateMode;selectedProcess='全体';render()}const pc=e.target.closest('.process-card:not(.disabled)');if(pc){selectedProcess=pc.dataset.process;render()}const product=e.target.closest('.product-card');if(product)openDetails(product.dataset.key)});
$('specifiedDate').addEventListener('change',()=>{dateMode='specified';selectedProcess='全体';render()});$('refresh').addEventListener('click',loadCSV);$('closeModal').addEventListener('click',()=>$('modal').classList.remove('show'));$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')});
loadCSV();setInterval(loadCSV,30000);
</script>
</body>
</html>
