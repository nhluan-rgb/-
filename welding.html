<style>

.date-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.date-tab{position:relative;padding:14px 16px;border:2px solid rgba(255,255,255,.32);border-radius:14px;background:rgba(20,31,42,.88);color:#fff;text-align:left;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.32)}.date-tab:hover,.date-tab.active{border-color:#ff7452;box-shadow:0 0 0 3px rgba(255,92,53,.23),0 5px 0 rgba(0,0,0,.32)}.date-tab .label{font-size:18px;font-weight:900}.date-tab .date{margin-top:4px;color:#ffcabd}.date-tab .count{position:absolute;right:15px;top:15px;font-size:27px;font-weight:900}.date-tab input{width:100%;margin-top:8px;padding:7px;border:0;border-radius:6px}

.board-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.board-title h2{margin:0;font-size:18px}.board-title span{color:#61707e;font-size:13px}
.process-grid{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr));gap:10px}.process-card{--c:#607d8b;position:relative;min-height:145px;padding:9px;border:3px solid var(--c);border-radius:15px;background:#fff;text-align:center;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 65%,#263238);transition:.18s}.process-card:hover,.process-card.active{transform:translateY(-3px);box-shadow:0 9px 0 color-mix(in srgb,var(--c) 65%,#263238)}.process-card .head{padding:8px 5px;border-radius:8px;background:var(--c);color:#fff;font-size:16px;font-weight:900}.process-card .value{font-size:27px;font-weight:1000;margin-top:18px}.process-card .sub{font-size:12px;color:#65727d}.process-card .bar{height:7px;margin:17px 10px 0;border-radius:9px;background:#e1e7e9;overflow:hidden}.process-card .fill{height:100%;background:var(--c)}
.process-card.total{--c:#19738c}.process-card.p0{--c:#d4a900}.process-card.p1{--c:#e46e00}.process-card.p2{--c:#d856a5}.process-card.p3{--c:#d93632}.process-card.disabled{--c:#77838e;cursor:not-allowed;filter:grayscale(.25);background:#e9edf0}.process-card.disabled:hover{transform:none;box-shadow:0 6px 0 #4d5861}.stamp{position:absolute;left:50%;top:63%;transform:translate(-50%,-50%) rotate(-10deg);padding:5px 10px;border:4px double #b3261e;border-radius:7px;color:#b3261e;background:rgba(255,255,255,.82);font-size:22px;font-weight:1000;letter-spacing:.1em}
.product-area{margin-top:16px;min-height:380px;padding:17px;border:1px solid rgba(255,255,255,.34);border-radius:18px;background:rgba(11,25,36,.82);backdrop-filter:blur(8px);color:#fff}.product-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:13px}.product-head h2{margin:0;font-size:25px}.product-head p{margin:3px 0 0;color:#b9ced9}.material-legend{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;margin-bottom:8px}.material-chip{--mc:#607d8b;display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:2px solid var(--mc);border-radius:999px;background:#fff;color:#17212b;font-size:12px;font-weight:900}.material-chip:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mc)}.material-iron{--mc:#1976d2}.material-sus{--mc:#00897b}.material-super{--mc:#7e57c2}.material-dob{--mc:#8d6e63}.material-other{--mc:#607d8b}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}.product-card{position:relative;min-height:170px;padding:17px;border:2px solid rgba(255,255,255,.36);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(232,240,245,.95));color:#17212b;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:.18s;overflow:hidden}.product-card:hover{transform:translateY(-4px);border-color:#ff7654}.product-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--stripe,#607d8b)}.product-name{padding-left:4px;font-size:21px;font-weight:1000;line-height:1.25}.product-part{margin-top:7px;color:#416277;font-weight:700}.material-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.material-badge{--mc:#607d8b;padding:5px 8px;border-radius:8px;background:color-mix(in srgb,var(--mc) 15%,#fff);border:1px solid color-mix(in srgb,var(--mc) 75%,#fff);color:color-mix(in srgb,var(--mc) 78%,#17212b);font-size:12px;font-weight:1000}.product-meta{display:flex;justify-content:space-between;align-items:end;margin-top:16px}.product-count{font-size:27px;font-weight:1000;color:#d93c27}.product-qty{font-size:15px;color:#5d6b75}.empty{grid-column:1/-1;display:grid;place-items:center;min-height:280px;border:2px dashed rgba(255,255,255,.35);border-radius:15px;color:#c5d4dc;font-size:21px;font-weight:800}

.top-material-legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px;padding:11px 15px;border:1px solid rgba(255,255,255,.42);border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 7px 20px rgba(0,0,0,.22)}.top-material-legend .legend-title{font-size:15px;font-weight:1000;margin-right:4px}.dashboard-row{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:stretch}.dashboard-row .process-board{height:100%}.product-chart{padding:15px;border:1px solid rgba(255,255,255,.38);border-radius:18px;background:rgba(242,247,250,.95);box-shadow:0 14px 40px rgba(0,0,0,.3)}.chart-title{font-size:18px;font-weight:1000;margin-bottom:3px}.chart-sub{font-size:12px;color:#65727d;margin-bottom:8px}.pie-wrap{display:flex;flex-direction:column;align-items:center}.product-pie{--pie:#d9e1e6;position:relative;width:205px;height:205px;border-radius:50%;background:var(--pie);box-shadow:0 0 0 7px #fff,0 8px 24px rgba(0,0,0,.22)}.product-pie:after{content:"";position:absolute;inset:43px;border-radius:50%;background:#f8fbfc}.pie-center{position:absolute;z-index:2;inset:0;display:grid;place-content:center;text-align:center}.pie-center b{font-size:30px}.pie-center small{font-size:12px;color:#687883}.pie-legend{width:100%;display:grid;gap:5px;margin-top:12px;max-height:155px;overflow:auto}.pie-item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:7px;align-items:center;padding:4px 6px;border-radius:7px;background:#fff;font-size:12px}.pie-dot{width:11px;height:11px;border-radius:50%;background:var(--pc)}.pie-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}.pie-value{font-weight:1000;color:#344b59}
.modal{display:none;position:fixed;inset:0;z-index:20;padding:25px;background:rgba(0,0,0,.72);align-items:center;justify-content:center}.modal.show{display:flex}.modal-card{width:min(1050px,96vw);max-height:90vh;overflow:auto;border-radius:19px;background:#fff;box-shadow:0 25px 80px #000;padding:20px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:13px}.modal-head h3{margin:0;font-size:25px}.close{border:0;background:#e9eef1;border-radius:9px;padding:8px 13px;font-size:18px;cursor:pointer}.detail-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.detail-box{padding:12px;border:1px solid var(--line);border-radius:10px;background:#f7fafb}.detail-box small{color:#6d7b86}.detail-box b{display:block;margin-top:4px;font-size:18px}.detail-list{display:grid;gap:8px}.detail-row{display:grid;grid-template-columns:1.2fr 1fr 1.6fr .6fr 1fr 1fr;gap:8px;padding:10px;border-bottom:1px solid #e7ecef;align-items:center}.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#ffe3df;color:#aa2c20;font-weight:800;text-align:center}

<body>
<header><div><h1><span class="weld-icon">🥽</span> 溶接工程ボード</h1><p>生地日を基準に、CAD/CAMから溶接までを管理</p></div><div class="actions"><a class="btn" href="index.html">← 新世界へ戻る</a><button class="btn primary" id="refresh">更新</button></div></header>
<main>
<div class="notice" id="notice"><span>SCV.csvを読み込み中です。</span><button onclick="this.parentElement.remove()">×</button></div>
<section class="date-tabs">
<button class="date-tab active" data-date-mode="today"><div class="label">今日生地</div><div class="date" id="dateToday"></div><div class="count" id="countToday">0</div></button>
<button class="date-tab" data-date-mode="tomorrow"><div class="label">明日生地</div><div class="date" id="dateTomorrow"></div><div class="count" id="countTomorrow">0</div></button>
<button class="date-tab" data-date-mode="after"><div class="label">明後日生地</div><div class="date" id="dateAfter"></div><div class="count" id="countAfter">0</div></button>
<button class="date-tab" data-date-mode="specified"><div class="label">指定日生地日</div><input type="date" id="specifiedDate"><div class="count" id="countSpecified">0</div></button>
</section>
<section class="process-board"><div class="board-title"><h2>工程進捗 <small>（CAD/CAMから溶接まで）</small></h2><span>工程を選択すると品名別に表示します</span></div>
<section class="top-material-legend"><span class="legend-title">材質 <small>（品番の先頭文字で分類）</small></span><span class="material-chip material-iron"><b>I B</b><span>鉄（品番 I・B）</span></span><span class="material-chip material-sus"><b>S</b><span>SUS（品番 S）</span></span><span class="material-chip material-super"><b>D</b><span>スーパーダイマ（品番 D）</span></span><span class="material-chip material-dob"><b>Z</b><span>ドブ（品番 Z）</span></span></section>
<div class="process-grid" id="processGrid"></div></section>
<div class="lower-dashboard">
<section class="product-area"><div class="product-head"><div><h2 id="productTitle">全体・品名一覧</h2><p id="productSub">同じ形状は材質が違っても1つにまとめて表示します</p></div><div><b id="resultSummary">0件</b></div></div><div class="product-grid" id="productGrid"></div></section>
<section class="product-chart"><div class="chart-title">品名別構成（件数）</div><div class="chart-sub" id="chartSub">選択中の工程を件数で表示</div><div class="pie-wrap"><div class="product-pie" id="productPie"><div class="pie-center"><b id="pieTotal">0</b><small>件 合計</small></div></div><div class="pie-legend" id="pieLegend"></div></div></section>
</div>
</main>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><div><h3 id="modalTitle"></h3><div id="modalPart"></div></div><button class="close" id="closeModal">×</button></div><div class="detail-summary" id="detailSummary"></div><div class="detail-list" id="detailList"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('ja-JP');
let rows=[],dateMode='today',selectedProcess='全体';
const processOrder=['CAD/CAM','切断','曲げ','溶接'];
const allCards=['全体','CAD/CAM','切断','曲げ','溶接','仕上げ','塗装','組立'];
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dates(){const t=new Date();t.setHours(0,0,0,0);const d1=new Date(t),d2=new Date(t);d1.setDate(t.getDate()+1);d2.setDate(t.getDate()+2);return{today:localDate(t),tomorrow:localDate(d1),after:localDate(d2)}}
function excelDate(v){
  if(v===null||v===undefined||v==='')return'';
  if(v instanceof Date&&!isNaN(v))return localDate(v);
  if(typeof v==='number'||/^\d{5}(?:\.\d+)?$/.test(String(v).trim())){
    const n=Number(v);if(n>20000&&n<80000)return localDate(new Date(Math.round((n-25569)*86400000)));
  }
  const s=String(v).trim().replace(/[年月]/g,'-').replace(/日/g,'').replace(/[\.\/]/g,'-');
  const m=s.match(/(20\d{2})\D+(\d{1,2})\D+(\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'';
}
function materialInfo(part){const c=String(part||'').trim().charAt(0).toUpperCase();if(c==='I'||c==='B')return{key:'iron',label:'鉄',cls:'material-iron',color:'#1976d2'};if(c==='S')return{key:'sus',label:'SUS',cls:'material-sus',color:'#00897b'};if(c==='D')return{key:'super',label:'スーパーダイマ',cls:'material-super',color:'#7e57c2'};if(c==='Z')return{key:'dob',label:'ドブ',cls:'material-dob',color:'#8d6e63'};return{key:'other',label:'その他',cls:'material-other',color:'#607d8b'}}
function productFamily(name){let s=String(name||'').trim().replace(/^(SUS|ＳＵＳ|鉄|国土|ZN|ＺＮ|ドブ|スーパーダイマ|Sダイマ|Ｓダイマ|ダイマ)[\s　]*/i,'');s=s.replace(/[\s　]+/g,' ').trim();return s||'品名未設定'}
function normalizeKeys(o){const n={};Object.entries(o||{}).forEach(([k,v])=>n[String(k).replace(/^\uFEFF/,'').replace(/[\s　]/g,'').trim()]=v);return n}
function pick(o,...keys){for(const k of keys){const nk=String(k).replace(/[\s　]/g,'');if(o[nk]!==undefined&&o[nk]!==null&&String(o[nk]).trim()!=='')return o[nk]}return''}
function normalize(src){const o=normalizeKeys(src);const part=String(pick(o,'品番','品番コード','商品コード')).trim(),name=String(pick(o,'品名','商品名')).trim()||'品名未設定';return{id:String(pick(o,'製造指示番号','指示番号','製造番号')).trim(),part,name,family:productFamily(name),material:materialInfo(part),standard:String(pick(o,'規格','仕様')).trim(),qty:Number(String(pick(o,'数量','数量(点)','数量（点）')||0).replace(/,/g,''))||0,materialDate:excelDate(pick(o,'生地日','生地日付','生地予定日')),shipDate:excelDate(pick(o,'出荷日')),due:excelDate(pick(o,'製造期限')),status:String(pick(o,'進捗','工程','現在工程','進捗状況')).trim(),owner:String(pick(o,'担当者','担当')).trim(),ship:String(pick(o,'配送便')).trim()}}
function selectedDate(){const ds=dates();return dateMode==='specified'?$('specifiedDate').value:ds[dateMode]}
function processName(s){
  const v=String(s||'').replace(/[\s　]/g,'');
  if(/CAD|CAM/i.test(v))return 'CAD/CAM';
  if(/切断|水切|レーザー|パンチ/.test(v))return '切断';
  if(/曲げ|ベンダ/.test(v))return '曲げ';
  if(/溶接/.test(v))return '溶接';
  if(/仕上/.test(v))return '仕上げ';
  if(/塗装/.test(v))return '塗装';
  if(/組立/.test(v))return '組立';
  return '';
}
function stageIndex(s){return processOrder.indexOf(processName(s))}
function baseRowsForDate(date){return rows.filter(r=>r.materialDate===date&&!r.status.includes('ｷｬﾝｾﾙ')&&!r.status.includes('キャンセル'))}
function processRows(base,p){if(p==='全体')return base.filter(r=>stageIndex(r.status)>=0);return base.filter(r=>processName(r.status)===p)}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function updateDateLabels(){const ds=dates();$('dateToday').textContent=ds.today;$('dateTomorrow').textContent=ds.tomorrow;$('dateAfter').textContent=ds.after;if(!$('specifiedDate').value)$('specifiedDate').value=ds.today;for(const [key,id] of [['today','countToday'],['tomorrow','countTomorrow'],['after','countAfter']])$(id).textContent=fmt(baseRowsForDate(ds[key]).filter(r=>stageIndex(r.status)>=0).length);$('countSpecified').textContent=fmt(baseRowsForDate($('specifiedDate').value).filter(r=>stageIndex(r.status)>=0).length)}
function renderProcesses(){const base=baseRowsForDate(selectedDate());const relevant=base.filter(r=>stageIndex(r.status)>=0);const max=Math.max(1,...processOrder.map(p=>base.filter(r=>processName(r.status)===p).length));$('processGrid').innerHTML=allCards.map((p,i)=>{const disabled=i>=5;const count=p==='全体'?relevant.length:disabled?0:base.filter(r=>processName(r.status)===p).length;const qty=p==='全体'?relevant.reduce((a,r)=>a+r.qty,0):disabled?0:base.filter(r=>processName(r.status)===p).reduce((a,r)=>a+r.qty,0);const cls=p==='全体'?'total':i>0&&i<5?`p${i-1}`:'';return `<button class="process-card ${cls} ${disabled?'disabled':''} ${selectedProcess===p?'active':''}" data-process="${p}" ${disabled?'disabled':''}><div class="head">${p}</div>${disabled?'<div class="stamp">対象外</div>':`<div class="value">${fmt(count)}件</div><div class="sub">${fmt(qty)}点</div><div class="bar"><div class="fill" style="width:${p==='全体'?100:count/max*100}%"></div></div>`}</button>`}).join('')}
function renderProductChart(data){const counts=new Map();data.forEach(r=>counts.set(r.family,(counts.get(r.family)||0)+1));let items=[...counts.entries()].sort((a,b)=>b[1]-a[1]);if(items.length>8){const other=items.slice(7).reduce((a,x)=>a+x[1],0);items=[...items.slice(0,7),['その他',other]]}const total=data.length;const colors=['#e53935','#1976d2','#00897b','#f57c00','#7e57c2','#d4a900','#546e7a','#ec6cb9'];let pos=0;const stops=items.map(([name,val],i)=>{const start=total?pos/total*100:0;pos+=val;const end=total?pos/total*100:0;return `${colors[i%colors.length]} ${start}% ${end}%`});$('productPie').style.setProperty('--pie',stops.length?`conic-gradient(${stops.join(',')})`:'#d9e1e6');$('pieTotal').textContent=fmt(total);$('chartSub').textContent=`${selectedProcess} ／ 生地日 ${selectedDate()} ／ 件数比率`;$('pieLegend').innerHTML=items.length?items.map(([name,val],i)=>`<div class="pie-item"><span class="pie-dot" style="--pc:${colors[i%colors.length]}"></span><span class="pie-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span><span class="pie-value">${fmt(val)}件</span></div>`).join(''):'<div class="pie-item"><span></span><span class="pie-name">対象データなし</span><span></span></div>'}
function renderProducts(){const base=baseRowsForDate(selectedDate());const data=processRows(base,selectedProcess);renderProductChart(data);const groups=new Map();data.forEach(r=>{const key=r.family;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});$('productTitle').textContent=`${selectedProcess}・品名一覧`;$('productSub').textContent=`生地日 ${selectedDate()} ／ 同じ形状は材質違いでもまとめて表示`;$('resultSummary').textContent=`${fmt(groups.size)}種類・${fmt(data.length)}件・${fmt(data.reduce((a,r)=>a+r.qty,0))}点`;$('productGrid').innerHTML=groups.size?[...groups.entries()].sort((a,b)=>b[1].length-a[1].length).map(([family,list])=>{const mats=new Map();list.forEach(r=>{const k=r.material.key;if(!mats.has(k))mats.set(k,{...r.material,count:0,qty:0});const m=mats.get(k);m.count++;m.qty+=r.qty});const badges=[...mats.values()].map(m=>`<span class="material-badge ${m.cls}" style="--mc:${m.color}">${m.label} ${fmt(m.count)}件</span>`).join('');const stripe=[...mats.values()].map(m=>m.color).join(',');return `<button class="product-card" style="--stripe:${stripe.includes(',')?`linear-gradient(to bottom,${[...mats.values()].map((m,i,a)=>`${m.color} ${i/a.length*100}% ${(i+1)/a.length*100}%`).join(',')})`:stripe}" data-key="${escapeHtml(encodeURIComponent(family))}"><div class="product-name">${escapeHtml(family)}</div><div class="product-part">材質別にまとめて表示</div><div class="material-list">${badges}</div><div class="product-meta"><div class="product-count">${fmt(list.length)}件</div><div class="product-qty">${fmt(list.reduce((a,r)=>a+r.qty,0))}点</div></div></button>`}).join(''):'<div class="empty">対象データはありません</div>'}
function render(){updateDateLabels();renderProcesses();renderProducts();document.querySelectorAll('.date-tab').forEach(b=>b.classList.toggle('active',b.dataset.dateMode===dateMode))}
function openDetails(key){const base=processRows(baseRowsForDate(selectedDate()),selectedProcess);const family=decodeURIComponent(key);const list=base.filter(r=>r.family===family);const mats=[...new Set(list.map(r=>r.material.label))].join('・');$('modalTitle').textContent=family;$('modalPart').textContent=`材質：${mats||'未分類'}`;$('detailSummary').innerHTML=`<div class="detail-box"><small>対象件数</small><b>${fmt(list.length)}件</b></div><div class="detail-box"><small>合計数量</small><b>${fmt(list.reduce((a,r)=>a+r.qty,0))}点</b></div><div class="detail-box"><small>生地日</small><b>${selectedDate()}</b></div><div class="detail-box"><small>選択工程</small><b>${selectedProcess}</b></div>`;$('detailList').innerHTML=list.map(r=>`<div class="detail-row"><b>${escapeHtml(r.id)}</b><span><b class="material-badge ${r.material.cls}" style="--mc:${r.material.color}">${r.material.label}</b><br>${escapeHtml(r.part||'品番なし')}</span><span>${escapeHtml(r.name)}<br><small>${escapeHtml(r.standard||'-')}</small></span><b>${fmt(r.qty)}点</b><span class="status">${escapeHtml(r.status)}</span><span>${escapeHtml(r.owner||'未設定')}</span></div>`).join('');$('modal').classList.add('show')}
function parseCsvBuffer(buf){
  const bytes=new Uint8Array(buf);

  // SCV.csv は UTF-8。文字化けした Shift-JIS を選ばないよう、
  // 日本語ヘッダーが正しく存在する候補だけを採用する。
  for(const enc of ['utf-8','shift-jis']){
    try{
      const txt=new TextDecoder(enc).decode(bytes).replace(/^\uFEFF/,'');
      const wb=XLSX.read(txt,{type:'string',cellDates:true});
      const raw=XLSX.utils.sheet_to_json(
        wb.Sheets[wb.SheetNames[0]],
        {defval:'',raw:false,dateNF:'yyyy-mm-dd'}
      );
      if(!raw.length)continue;

      const keys=Object.keys(raw[0]||{}).map(
        k=>String(k).replace(/^\uFEFF/,'').replace(/[\s　]/g,'')
      );
      const required=['製造指示番号','品番','品名','数量','進捗','生地日'];
      if(required.every(k=>keys.includes(k)))return raw;
    }catch(e){}
  }

  // 最終フォールバック
  const txt=new TextDecoder('utf-8').decode(bytes).replace(/^\uFEFF/,'');
  const wb=XLSX.read(txt,{type:'string',cellDates:true});
  return XLSX.utils.sheet_to_json(
    wb.Sheets[wb.SheetNames[0]],
    {defval:'',raw:false,dateNF:'yyyy-mm-dd'}
  );
}
async function loadCSV(){try{
  const res=await fetch('SCV.csv?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);
  const normalized=parseCsvBuffer(await res.arrayBuffer()).map(normalize);
  rows=normalized.filter(r=>r.id&&r.materialDate);
  const missing=normalized.filter(r=>r.id&&!r.materialDate).length,recognized=rows.filter(r=>stageIndex(r.status)>=0).length;
  $('notice').innerHTML=`<span>✓ SCV.csvから${fmt(rows.length)}件を読み込みました。工程認識 ${fmt(recognized)}件${missing?` ／ 生地日未認識 ${fmt(missing)}件`:''}</span><button onclick="this.parentElement.remove()">×</button>`;
  render();
}catch(e){$('notice').innerHTML=`<span>⚠ SCV.csvを読み込めません：${escapeHtml(e.message||'不明なエラー')}</span><button onclick="this.parentElement.remove()">×</button>`;render()}}
document.addEventListener('click',e=>{const tab=e.target.closest('.date-tab');if(tab&&!e.target.matches('input')){dateMode=tab.dataset.dateMode;selectedProcess='全体';render()}const pc=e.target.closest('.process-card:not(.disabled)');if(pc){selectedProcess=pc.dataset.process;render()}const product=e.target.closest('.product-card');if(product)openDetails(product.dataset.key)});
$('specifiedDate').addEventListener('change',()=>{dateMode='specified';selectedProcess='全体';render()});$('refresh').addEventListener('click',loadCSV);$('closeModal').addEventListener('click',()=>$('modal').classList.remove('show'));$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')});
loadCSV();setInterval(loadCSV,30000);
</script>
